# Render Blueprint for GitCompass
# Deploy all services with: render blueprint launch

services:
  # Backend API (Node.js/Express)
  - type: web
    name: gitcompass-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: MONGODB_URI
        sync: false # Set manually in Render dashboard
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        value: https://gitcompass.onrender.com/api/auth/github/callback
      - key: CLIENT_URL
        value: https://gitcompass.vercel.app
      - key: AI_SERVICE_URL
        value: https://ai-engine-tnqy.onrender.com

  # AI Engine (Python/FastAPI)
  - type: web
    name: gitcompass-ai-engine
    runtime: python
    region: oregon
    plan: free
    rootDir: ai-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
